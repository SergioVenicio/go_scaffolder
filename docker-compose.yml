services:
  postgres:
    image: postgres:17.2-alpine
    restart: always
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    command: >
      postgres -c "shared_preload_libraries=pg_stat_statements"
  pubsub:
    image: google/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=productstest
    ports:
      - "8085:8085"
    volumes:
      - pubsub_data:/emulator_data
volumes:
  pg_data:
  pubsub_data: